name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'luci-theme-ink/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 主题为 noarch,任一 apk-based SDK 产出的包即可装到 apk 系统(如 OpenWrt 25.12)。
        # SNAPSHOT 容器长期可用且为 apk 格式;如需锁定发行版可加 x86_64-25.12.x。
        arch:
          - x86_64-SNAPSHOT
    steps:
      - uses: actions/checkout@v4

      - name: Build package via OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: ink
          PACKAGES: luci-theme-ink
          NO_REFRESH_CHECK: 1
          V: s

      - name: Collect packages
        run: |
          mkdir -p dist
          find bin/ -type f \( -name 'luci-theme-ink*.apk' -o -name 'luci-theme-ink*.ipk' \) -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-ink-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
